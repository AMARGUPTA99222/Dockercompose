<!DOCTYPE html>
<html>
<head>
<title>Docker Compose E-Commerce Lab</title>
</head>
<body>
<h1>E-Commerce Docker Compose Lab</h1>
<p>NGINX + Frontend + FastAPI + MySQL + Elasticsearch</p>

<h2>Products</h2>
<button onclick="loadProducts()">Load Products</button>
<pre id="products"></pre>

<h2>Search</h2>
<input id="query" placeholder="Search product">
<button onclick="searchProducts()">Search</button>
<pre id="search"></pre>

<script>
async function loadProducts() {
    const r = await fetch('/api/products');
    document.getElementById('products').textContent =
        JSON.stringify(await r.json(), null, 2);
}

async function searchProducts() {
    const q = document.getElementById('query').value;
    const r = await fetch('/api/search?q=' + encodeURIComponent(q));
    document.getElementById('search').textContent =
        JSON.stringify(await r.json(), null, 2);
}
</script>
</body>
</html>
